services:
  - type: web
    name: insurcheck
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npm install --prefix client && npm run build --prefix client
    startCommand: node server/index.js
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

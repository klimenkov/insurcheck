services:
  - type: web
    name: insurcheck
    env: node
    plan: starter
    region: oregon
    disk:
      name: insurcheck-data
      mountPath: /data
      sizeGB: 1
    buildCommand: npm install --include=dev && npm install --include=dev --prefix client && npm run build --prefix client
    startCommand: node server/index.js
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_PATH
        value: /data/insurcheck.db
